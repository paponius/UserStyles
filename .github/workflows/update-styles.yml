# .github/workflows/update-styles.yml
name: Update Style Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Process styles
        run: python process_styles.py

      - name: Sync base files to main branch
        run: |
          # Copy generated base directories into the repository root
          cp -r main_output/* .
          rm -rf main_output

      - name: Commit base files to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update base userstyles"
          file_pattern: "**/ *.user.css manifest.yml"

      - name: Push clones to site-clones branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -d "clones_output" ] || [ -z "$(ls -A clones_output)" ]; then
            echo "No clones to push."
            exit 0
          fi

          # Switch to site-clones branch or create it as an orphan if it doesn't exist
          if git ls-remote --exit-code --heads origin site-clones; then
            git fetch origin site-clones
            git checkout site-clones
          else
            git checkout --orphan site-clones
            git rm -rf .
          fi

          # Clear working tree and copy new clone files
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cp -r clones_output/* .

          git add .
          if git diff --staged --quiet; then
            echo "No changes in clones to commit."
          else
            git commit -m "Auto-update site-clones: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin site-clones
          fi
