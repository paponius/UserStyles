name: Update Style Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process styles
        run: |
          mkdir -p denikn
          
          # Style 30847
          curl -sL "https://userstyles.world/api/style/30847.user.css" -o "denikn/30847.user.css"
          cp denikn/30847.user.css denikn/copy30847.user.css
          sed -i '/^@name[[:blank:]]/s/$/ copy/' denikn/copy30847.user.css
          
          # Style 30846
          curl -sL "https://userstyles.world/api/style/30846.user.css" -o "denikn/30846.user.css"
          cp denikn/30846.user.css denikn/copy30846.user.css
          sed -i '/^@name[[:blank:]]/s/$/ copy/' denikn/copy30846.user.css

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update styles and create modified copies"
          file_pattern: "denikn/30847.user.css denikn/copy30847.user.css denikn/30846.user.css denikn/copy30846.user.css"
